name: PAYNAPSE PostgreSQL 16 Tests

on:
  workflow_dispatch:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paynapse_test
          POSTGRES_PASSWORD: test_only_ci_password
          POSTGRES_DB: paynapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paynapse_test -d paynapse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      PAYNAPSE_PG_DSN: postgresql://paynapse_test:test_only_ci_password@127.0.0.1:5432/paynapse_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract PAYNAPSE Pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot
          unzip -q "PAYNAPSE PILOT READY.zip" -d pilot
          test -f pilot/postgres_integration_test.py
          test -f pilot/test_postgres_concurrency.py
          test -f pilot/verify_postgres_log.py

      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Run real PostgreSQL tests
        working-directory: pilot
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v postgres_integration_test test_postgres_concurrency test_pg_tenant_postings 2>&1 | tee postgres_real_test_results.log
          python verify_postgres_log.py postgres_real_test_results.log

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paynapse-postgres-evidence
          path: pilot/postgres_real_test_results.log
          if-no-files-found: warn
